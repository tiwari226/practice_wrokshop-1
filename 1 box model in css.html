<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
   .box{
    border: 1px solid black;
    background-color: orange;
    height: 100px;
    width: 300px;
    padding: 100px;
    margin: 5px;
    box-sizing: border-box;
   }
   #a{
    background-color: orange;
   }
   #b{
    background-color:white;
   }
   #c{
    background-color: green;
   }
</style>
</head>
<body>
    <div class="box" id="a" >Block  </div>
    <div  class="box" id="b" >Block B </div>
    <div  class="box" id="c" >Block C</div>
</body>
</html>
